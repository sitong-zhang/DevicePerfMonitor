[versions]
# 工具链：AGP 8.13.2 + Kotlin 2.4.21 + Gradle 8.14.6（避开 AGP 9：不再支持 org.jetbrains.kotlin.android）
# 版本兼容矩阵（均已通过 AAR/Gradle Module 元数据核实，见 README「依赖版本兼容性」一节）：
#   compose-bom 2026.06.01 -> compose 1.11.4 + material3 1.4.0 (minAGP 8.6.0 / minCompileSdk 35)
#     material3 1.4.0 起含 Material 3 Expressive 组件与 MotionScheme（1.0.8 视觉底座）
#   Vico 3.2.3 -> CMP 1.11.0（AAR minCompileSdk=36；3.3.x 要求 37）
#   navigation 2.9.4 -> lifecycle 2.9.0（2.10.x 的 navigation-common POM 硬依赖 lifecycle 2.11.0 需 AGP 9.1）
#   activity 1.12.4 (minAGP 8.9.1 / minCompileSdk 36) / lifecycle 2.9.4 / core-ktx 1.15.0 (1.16+ 需 AGP 9.1)
agp = "8.13.2"
kotlin = "2.4.21"
coreKtx = "1.15.0"
activityCompose = "1.12.4"
lifecycle = "2.9.4"
composeBom = "2026.06.01"
navigation = "2.9.4"
datastore = "1.3.0"
junit = "4.13.2"
archCore = "2.2.0"
# 第三方库（协议见 README 依赖表）
vico = "3.2.3"          # Apache-2.0，Compose 图表
shizuku = "13.1.5"      # Apache-2.0(?) 见 README，全局 FPS 提权通道（可选）

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-arch-core-runtime = { group = "androidx.arch.core", name = "core-runtime", version.ref = "archCore" }
androidx-arch-core-common = { group = "androidx.arch.core", name = "core-common", version.ref = "archCore" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
