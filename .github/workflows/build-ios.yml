name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # ---------- 观序（GuanXu）未签名 IPA ----------
      - name: Generate GuanXu Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build GuanXu unsigned app
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -project GuanXu.xcodeproj -scheme GuanXu \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            BUILD_DIR=$PWD/build build 2>&1 | tee build.log

      - name: Package GuanXu unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP=$(find build -name 'GuanXu.app' -type d | head -1)
          if [ -z "$APP" ]; then echo "未找到 GuanXu.app"; exit 1; fi
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r GuanXu-unsigned.ipa Payload
          ls -lh GuanXu-unsigned.ipa

      # ---------- 全能签（签名工具，Feather 改造版）未签名 IPA ----------
      # 该步骤尽力而为：全能签 编译失败不影响观序 IPA 正常发布。
      # BRAND_REPORT_TOKEN：签名回执上报用的最小权限 PAT（仅本仓库 issues:write），
      # 构建期注入 Info.plist 的 BrandReportToken；未配置时 全能签 自动降级为本地存档。
      - name: Build 全能签 signer unsigned IPA (best-effort)
        continue-on-error: true
        working-directory: sign-tool
        env:
          BRAND_REPORT_TOKEN: ${{ secrets.BRAND_REPORT_TOKEN }}
        run: |
          set -euo pipefail
          xcodebuild -workspace Feather.xcworkspace -scheme Feather \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            BRAND_REPORT_TOKEN="$BRAND_REPORT_TOKEN" \
            -archivePath $PWD/build/Feather.xcarchive archive 2>&1 | tee feather.log
          APP=$(find build/Feather.xcarchive/Products/Applications -name 'Feather.app' -type d | head -1)
          if [ -z "$APP" ]; then echo "未找到 Feather.app"; exit 1; fi
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r ../Quannengqian-unsigned.ipa Payload
          ls -lh ../Quannengqian-unsigned.ipa

      - name: Remove previous rolling release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ios-unsigned -y || true
          git push origin :refs/tags/ios-unsigned || true

      - name: Upload GuanXu IPA to ios-unsigned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-unsigned
          name: 观序 iOS 安装包（未签名）
          body: |
            观序 苹果版未签名 IPA（GuanXu-unsigned.ipa）+ 配套签名工具（Quannengqian-unsigned.ipa）。
            全能签 安装后只做一件事：用你的 Apple ID 把观序签名装到本机，完成后自动关闭。
            免费 Apple ID 证书 7 天有效，到期重新签名安装即可。
          files: ios/GuanXu-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload 全能签 signer IPA (if built)
        if: ${{ hashFiles('Quannengqian-unsigned.ipa') != '' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-unsigned
          files: Quannengqian-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
