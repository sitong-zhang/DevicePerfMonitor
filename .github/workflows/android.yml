name: Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      # design-tokens.json 在仓库根：Android 的 DesignTokens.kt 由它在构建期生成，
      # 改了色板/参数必须触发构建，否则「token 改了但包没重出」
      - "design-tokens.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release APK
        working-directory: android
        run: |
          # runner 镜像自带 Android SDK；没有时回退到 $ANDROID_SDK_ROOT
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT must be set" >&2
            exit 1
          fi
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevicePerfMonitor-${{ github.sha }}
          # 1.0.13~1.0.15 曾按 flavor 出双包（路径为 apk/<flavor>/release/）；
          # 1.0.16 起合并为单一发布包，产物固定在 apk/release/ 下
          path: |
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
