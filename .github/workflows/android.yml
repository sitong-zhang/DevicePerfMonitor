name: Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      # design-tokens.json 在仓库根：Android 的 DesignTokens.kt 由它在构建期生成，
      # 改了色板/参数必须触发构建，否则「token 改了但包没重出」
      - "design-tokens.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 固定签名（1.0.43 起）：密钥库与 keystore.properties 已随仓库内置
      # （android/keystore/），本地与 CI 构建同签名，永不漂移。
      # （1.0.26~1.0.42 走 secrets 注入 + 无配置时降级 debug 签名，
      #  构建环境一重建签名就漂移、用户覆盖安装报「签名不一致」——已废弃。）
      - name: Confirm fixed signing present
        working-directory: android
        run: |
          test -f keystore.properties || { echo "::error::缺少 keystore.properties（固定签名配置）" >&2; exit 1; }
          test -f keystore/devperf-release.keystore || { echo "::error::缺少固定密钥库 android/keystore/devperf-release.keystore" >&2; exit 1; }
          echo "::notice::固定签名配置就绪（密钥库随仓库走）"

      - name: Build release APK
        working-directory: android
        # DEVPERF_FEEDBACK_TOKEN：意见反馈直连 GitHub 的最小权限 PAT（仅本仓库
        # issues:write）。为空时 App 自动降级为「拉起浏览器打开预填 issue 页」，
        # 反馈路径不断。在仓库 Secrets 里加这个变量即可让每次发版自动注入。
        # DEVPERF_SERVER_URL：自建后端地址（账号 / 验证码 / 同步 / 管控 / 公告）。
        # 默认本机联调地址（10.0.2.2:5000），发版时通过此变量指向已部署的后端。
        env:
          DEVPERF_FEEDBACK_TOKEN: ${{ secrets.DEVPERF_FEEDBACK_TOKEN }}
          DEVPERF_SERVER_URL: ${{ secrets.DEVPERF_SERVER_URL }}
          # 管理端密码：构建期注入，源码与 Release 说明中均不含明文
          DEVPERF_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # runner 镜像自带 Android SDK；没有时回退到 $ANDROID_SDK_ROOT
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT must be set" >&2
            exit 1
          fi
          # 后端地址注入（用户端 + 管理端共用）：默认本机联调地址，发版时通过
          # DEVPERF_SERVER_URL 指向已部署的后端服务；未配置则用默认值。
          if [ -n "$DEVPERF_SERVER_URL" ]; then
            echo "DEVPERF_SERVER_URL=$DEVPERF_SERVER_URL" >> local.properties
            echo "::notice::已注入后端地址：$DEVPERF_SERVER_URL"
          fi
          # 只构建用户端。管理端（:manager）自 2.0.2 起改为本地出包、直接交付，
          # 不再由 CI 构建或发布到仓库的 Release。
          ./gradlew :app:assembleRelease --no-daemon

      # 提取 app 版本号，用于 Release 的语义化 tag（vX.Y.Z）：
      # 让 app 端用 releases/latest 的 tag_name 做 isNewer 比较时能正确触发自动更新。
      - name: Read app version
        id: app_version
        run: |
          VER=$(grep -oE 'versionName\s*=\s*"[^"]+"' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "App version: $VER"

      # 签名核对：产物必须是固定长期密钥（指纹与 1.0.40+ 已发布包一致），
      # 防止任何环境构建出「签名不一致」的包
      - name: Verify APK signature
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -q "0c1cae6b561775edd34223d65de2530744e8c7d9143ec0b6e31f4bbcb4aaca82" /tmp/certs.txt || {
            echo "::error::APK 签名指纹与固定密钥不符（会导致用户覆盖安装报签名不一致）" >&2
            exit 1
          }

      - name: Upload APK to Release (versioned tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: PulseGuard 安卓版 APK v${{ steps.app_version.outputs.version }}
          make_latest: true
          # 1.0.41 起更新公告从仓库根 RELEASE_NOTES.md 读取：每次发版把「更新了
          # 哪些功能」写进该文件，应用内更新弹窗（releases/latest 的 body）就会
          # 展示完整更新说明，而不是千篇一律的安装包描述。
          body_path: RELEASE_NOTES.md
          # 1.0.13~1.0.15 曾按 flavor 出双包（路径为 apk/<flavor>/release/）；
          # 1.0.16 起合并为单一发布包，产物固定在 apk/release/ 下
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 管理端（:manager）不再发布到仓库：内含账号管控能力，属内部工具，
      # 改为本地构建后以「管理端<版本号>.apk」直接交付给管理人员。
