name: Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      # design-tokens.json 在仓库根：Android 的 DesignTokens.kt 由它在构建期生成，
      # 改了色板/参数必须触发构建，否则「token 改了但包没重出」
      - "design-tokens.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 正式签名（1.0.26 起）：仓库 secrets 里的 release keystore 解码到 android/ 并写
      # keystore.properties，assembleRelease 即用正式证书签名，与本地构建同签名。
      # 早期各版本用 debug keystore 签名，构建环境一重建签名就漂移、用户无法覆盖安装
      # （报「签名不一致」），正式 keystore 后所有版本签名稳定。
      - name: Set up release signing
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.DEVPERF_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEVPERF_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEVPERF_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DEVPERF_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::DEVPERF_KEYSTORE_BASE64 未配置，降级为 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > devperf-release.keystore
          {
            echo "storeFile=devperf-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        working-directory: android
        # DEVPERF_FEEDBACK_TOKEN：意见反馈直连 GitHub 的最小权限 PAT（仅本仓库
        # issues:write）。为空时 App 自动降级为「拉起浏览器打开预填 issue 页」，
        # 反馈路径不断。在仓库 Secrets 里加这个变量即可让每次发版自动注入。
        # 说明：:manager 在 CI 上没有 local.properties（含发公告 token），
        # 构建出的是「只读版管理端」（可看公告/签名记录，发公告不可用）——
        # 这是刻意的安全设计：带写凭证的管理端只在你自己电脑上构建，绝不公开分发。
        env:
          DEVPERF_FEEDBACK_TOKEN: ${{ secrets.DEVPERF_FEEDBACK_TOKEN }}
        run: |
          # runner 镜像自带 Android SDK；没有时回退到 $ANDROID_SDK_ROOT
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT must be set" >&2
            exit 1
          fi
          ./gradlew :app:assembleRelease :manager:assembleRelease --no-daemon

      # 签名核对：产物必须是正式证书（CN=DevicePerfMonitor），防止误用 debug 签名发版
      - name: Verify APK signature
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -q "CN=DevicePerfMonitor" /tmp/certs.txt || {
            echo "::error::APK 未使用正式证书签名" >&2
            exit 1
          }

      - name: Upload APK to Release (apk tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: 观序 安卓版 APK
          body: |
            观序 安卓版正式签名安装包（app-release.apk）。
            首次打开需注册 / 登录本地账号后即可使用。
          # 1.0.13~1.0.15 曾按 flavor 出双包（路径为 apk/<flavor>/release/）；
          # 1.0.16 起合并为单一发布包，产物固定在 apk/release/ 下
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 管理端 APK：固定上架到 manager tag 的 Release（用户拍板「先上架，说下架再下架」）。
      # CI 构建为只读版（不含发公告 token），带写凭证的版本仅本地构建。
      - name: Upload Manager APK to Release (manager tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manager
          name: 分子智能科技 · 管理端（只读版）
          body: |
            管理端安卓安装包（manager-release.apk）。
            功能：查看线上公告、查看 Brand 签名记录（Brand 每次签名完成后自动上报的回执）。
            发布公告等写操作需要写权限 token，只在内部构建中启用，公开分发版为只读。
          files: android/manager/build/outputs/apk/release/manager-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
