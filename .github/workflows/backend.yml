name: Backend Hosting (GitHub-hosted)

# 用 GitHub Actions 的 runner（GitHub 自己的 Linux 虚拟机）把 Flask 后端跑起来，
# 再用 cloudflared 临时隧道（无需注册账号）把 localhost:5000 暴露成公网 HTTPS 地址。
# 这是「纯 GitHub 自带能力」实现的后端托管：后端活在 GitHub 机器上。
#
# 关键设计：
#   - 拿到公网地址后自动写回本仓库 backend-host 分支的 backend-host.txt，
#     客户端启动时自动发现该地址，用户无需填写任何配置。
#   - 定时（每 5 小时）+ 手动两种触发，runner 单次上限 6 小时，
#     到期自动下线后由下一次定时运行接上，实现长期在线。
#   - SQLite 数据通过 actions/cache 跨运行持久化，重启不丢账号数据。
#
# 限制：每次重启公网地址会变（quick tunnel 特性），但客户端每次启动都重新
#       发现地址，因此对用户完全透明。

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "运行时长（小时，≤6）"
        required: false
        default: "5"
      maintenance:
        description: "维护模式（服务暂停）：true 启动即暂停并推送《服务暂停》公告"
        required: false
        default: "false"
  schedule:
    # 每 5 小时续期一次（UTC），保证后端长期在线
    - cron: "0 */5 * * *"

permissions:
  contents: write

concurrency:
  group: backend-hosting
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: backend/data
          key: backend-db-${{ github.run_id }}
          restore-keys: |
            backend-db-

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 迁移旧库（Actions 缓存 → 私有数据仓库）
        # runner 没有持久磁盘：此前账号库只靠 actions/cache 跨运行保存，
        # 一旦运行被取消/缓存淘汰，账号就"查无此人"。这里把缓存里残留的
        # 旧库一次性迁移到私有仓库（DevicePerfMonitor-data），之后由后端
        # 自己 pull/push 维护。仓库是私有的：里面有用户邮箱等隐私。
        env:
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -e
          if [ ! -f backend/data/app.db ]; then
            echo "缓存中没有旧库，跳过迁移"
            exit 0
          fi
          git config --global user.name "pulseguard-data-bot"
          git config --global user.email "pulseguard-data-bot@users.noreply.github.com"
          rm -rf /tmp/data-repo
          git clone --depth 1 \
            "https://x-access-token:${DATA_TOKEN}@github.com/sitong-zhang/DevicePerfMonitor-data.git" \
            /tmp/data-repo 2>/dev/null || {
              rm -rf /tmp/data-repo; mkdir -p /tmp/data-repo; cd /tmp/data-repo
              git init -q -b main
              git remote add origin \
                "https://x-access-token:${DATA_TOKEN}@github.com/sitong-zhang/DevicePerfMonitor-data.git"
            }
          cd /tmp/data-repo
          if [ -f app.db ]; then
            echo "私有仓库已有账号库，保留远端版本（不倒退覆盖）"
          else
            cp "$GITHUB_WORKSPACE/backend/data/app.db" app.db
            git add app.db
            git commit -q -m "chore(data): 迁移旧库（Actions 缓存）到私有数据仓库"
            git branch -M main
            git push -q origin main
            echo "旧库已迁移到私有数据仓库"
          fi

      - name: Start Flask backend
        working-directory: backend
        env:
          # 账号库持久化到私有仓库（公开仓库不能放用户数据）
          DATA_REPO: "sitong-zhang/DevicePerfMonitor-data"
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_SYNC_TOKEN: ${{ secrets.DATA_SYNC_TOKEN }}
          PORT: "5000"
          # 已配置真实邮件通道（QQ 邮箱 SMTP/465 SSL），关闭开发模式：
          # 验证码只走邮件下发，不再随响应回显。
          DEV_MODE: "0"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          # 维护模式：true 时启动即暂停服务并推送《服务暂停》公告（随时可关）
          MAINTENANCE: ${{ github.event.inputs.maintenance == 'true' && '1' || '' }}
        run: |
          # git 不跟踪空目录，runner 上 data/ 可能不存在，必须显式创建
          mkdir -p data
          nohup python app.py > /tmp/backend.log 2>&1 &
          echo "backend started, pid $!"

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health >/dev/null 2>&1; then
              echo "backend is up"; break
            fi
            sleep 2
          done
          curl -fsS http://localhost:5000/health || { echo "backend failed to start:"; tail -n 30 /tmp/backend.log; exit 1; }

      - name: Install cloudflared
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared; then
              break
            fi
            echo "download retry $i"; sleep 5
          done
          chmod +x cloudflared
          ./cloudflared --version

      - name: Expose backend via cloudflared quick tunnel
        id: tunnel
        run: |
          ./cloudflared tunnel --url http://localhost:5000 --no-autoupdate > /tmp/tunnel.log 2>&1 &
          echo "tunnel started, pid $!"
          URL=""
          for i in $(seq 1 40); do
            URL=$(grep -oE 'https://[a-z0-9.-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "未能获取隧道地址，日志如下："; tail -n 20 /tmp/tunnel.log; exit 1
          fi
          # 隧道刚建立时域名 DNS 可能尚未生效，用公网地址自检一次
          for i in $(seq 1 20); do
            if curl -fsS "$URL/health" >/dev/null 2>&1; then echo "public URL verified"; break; fi
            sleep 3
          done
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
          echo "========================================="
          echo "Backend public URL: $URL"
          echo "========================================="

      - name: Publish address to backend-host branch
        run: |
          set -e
          git config user.name "pulseguard-bot"
          git config user.email "pulseguard-bot@users.noreply.github.com"
          if git ls-remote --heads origin backend-host | grep -q "refs/heads/backend-host"; then
            git fetch origin backend-host
            git checkout -B backend-host origin/backend-host
          else
            git checkout --orphan backend-host
            git rm -rf . >/dev/null 2>&1 || true
          fi
          printf '%s\n' "$PUBLIC_URL" > backend-host.txt
          git add backend-host.txt
          git commit -m "chore(backend): 更新官方后端地址 $PUBLIC_URL" || echo "no change"
          git push origin backend-host
          {
            echo "## 官方后端地址已发布"
            echo ""
            echo "**$PUBLIC_URL**"
            echo ""
            echo "客户端启动时自动从 \`backend-host\` 分支的 \`backend-host.txt\` 发现该地址，无需用户配置。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep backend alive
        env:
          SYNC_TOKEN: ${{ secrets.DATA_SYNC_TOKEN }}
        run: |
          H="${{ github.event.inputs.hours }}"
          H="${H:-5}"
          if [ "$H" -gt 5 ] 2>/dev/null; then H=5; fi
          S=$((H * 3600))
          echo "Backend will stay alive for ${H}h (${S}s)..."
          end=$(( $(date +%s) + S ))
          last_sync=0
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 60
            # 后端或隧道意外退出则提前结束，交给下一次定时运行接手
            curl -fsS http://localhost:5000/health >/dev/null 2>&1 || { echo "backend down, exiting"; break; }
            now=$(date +%s)
            # 每 2 分钟把账号库推到私有数据仓库，避免进程被杀时丢数据
            if [ $((now - last_sync)) -ge 120 ]; then
              curl -fsS -X POST -H "X-Sync-Token: ${SYNC_TOKEN}" \
                http://localhost:5000/internal/sync || echo "sync 失败（下一轮重试）"
              last_sync=$now
            fi
          done
          # 退出前最后同步一次：即使上面 break/超时，账号数据也已经落仓
          curl -fsS -X POST -H "X-Sync-Token: ${SYNC_TOKEN}" \
            http://localhost:5000/internal/sync || echo "退出前同步失败"
          echo "Time is up — backend going offline. 下一次定时运行会自动接上。"
