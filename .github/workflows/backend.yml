name: Backend Hosting (GitHub-hosted)

# 用 GitHub Actions 的 runner（GitHub 自己的 Linux 虚拟机）把 Flask 后端跑起来，
# 再用 cloudflared 临时隧道（无需注册账号）把 localhost:5000 暴露成公网 HTTPS 地址。
# 这是「纯 GitHub 自带能力」实现的后端托管：后端活在 GitHub 机器上。
#
# 关键设计：
#   - 拿到公网地址后自动写回本仓库 backend-host 分支的 backend-host.txt，
#     客户端启动时自动发现该地址，用户无需填写任何配置。
#   - 定时（每 5 小时）+ 手动两种触发，runner 单次上限 6 小时，
#     到期自动下线后由下一次定时运行接上，实现长期在线。
#   - SQLite 数据通过 actions/cache 跨运行持久化，重启不丢账号数据。
#
# 限制：每次重启公网地址会变（quick tunnel 特性），但客户端每次启动都重新
#       发现地址，因此对用户完全透明。

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "运行时长（小时，≤6）"
        required: false
        default: "5"
  schedule:
    # 每 5 小时续期一次（UTC），保证后端长期在线
    - cron: "0 */5 * * *"

permissions:
  contents: write

concurrency:
  group: backend-hosting
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: backend/data
          key: backend-db-${{ github.run_id }}
          restore-keys: |
            backend-db-

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start Flask backend
        working-directory: backend
        env:
          PORT: "5000"
          # 已配置真实邮件通道（QQ 邮箱 SMTP/465 SSL），关闭开发模式：
          # 验证码只走邮件下发，不再随响应回显。
          DEV_MODE: "0"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          # git 不跟踪空目录，runner 上 data/ 可能不存在，必须显式创建
          mkdir -p data
          nohup python app.py > /tmp/backend.log 2>&1 &
          echo "backend started, pid $!"

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health >/dev/null 2>&1; then
              echo "backend is up"; break
            fi
            sleep 2
          done
          curl -fsS http://localhost:5000/health || { echo "backend failed to start:"; tail -n 30 /tmp/backend.log; exit 1; }

      - name: Install cloudflared
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared; then
              break
            fi
            echo "download retry $i"; sleep 5
          done
          chmod +x cloudflared
          ./cloudflared --version

      - name: Expose backend via cloudflared quick tunnel
        id: tunnel
        run: |
          ./cloudflared tunnel --url http://localhost:5000 --no-autoupdate > /tmp/tunnel.log 2>&1 &
          echo "tunnel started, pid $!"
          URL=""
          for i in $(seq 1 40); do
            URL=$(grep -oE 'https://[a-z0-9.-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "未能获取隧道地址，日志如下："; tail -n 20 /tmp/tunnel.log; exit 1
          fi
          # 隧道刚建立时域名 DNS 可能尚未生效，用公网地址自检一次
          for i in $(seq 1 20); do
            if curl -fsS "$URL/health" >/dev/null 2>&1; then echo "public URL verified"; break; fi
            sleep 3
          done
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
          echo "========================================="
          echo "Backend public URL: $URL"
          echo "========================================="

      - name: Publish address to backend-host branch
        run: |
          set -e
          git config user.name "pulseguard-bot"
          git config user.email "pulseguard-bot@users.noreply.github.com"
          if git ls-remote --heads origin backend-host | grep -q "refs/heads/backend-host"; then
            git fetch origin backend-host
            git checkout -B backend-host origin/backend-host
          else
            git checkout --orphan backend-host
            git rm -rf . >/dev/null 2>&1 || true
          fi
          printf '%s\n' "$PUBLIC_URL" > backend-host.txt
          git add backend-host.txt
          git commit -m "chore(backend): 更新官方后端地址 $PUBLIC_URL" || echo "no change"
          git push origin backend-host
          {
            echo "## 官方后端地址已发布"
            echo ""
            echo "**$PUBLIC_URL**"
            echo ""
            echo "客户端启动时自动从 \`backend-host\` 分支的 \`backend-host.txt\` 发现该地址，无需用户配置。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep backend alive
        run: |
          H="${{ github.event.inputs.hours }}"
          H="${H:-5}"
          if [ "$H" -gt 5 ] 2>/dev/null; then H=5; fi
          S=$((H * 3600))
          echo "Backend will stay alive for ${H}h (${S}s)..."
          end=$(( $(date +%s) + S ))
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 60
            # 后端或隧道意外退出则提前结束，交给下一次定时运行接手
            curl -fsS http://localhost:5000/health >/dev/null 2>&1 || { echo "backend down, exiting"; break; }
          done
          echo "Time is up — backend going offline. 下一次定时运行会自动接上。"
