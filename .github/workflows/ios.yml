name: iOS IPA

on:
  push:
    branches: [main, master]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    # macos-15：LiquidGlassKit 的原生玻璃路径编译依赖 iOS 26 SDK（Xcode 26+），
    # macos-14 镜像的 Xcode 15/16 无法编译（见 UIKit/LiquidGlass.swift 说明）。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 固定到 Xcode 26：macos-15 镜像上 26 系的真实路径是
      # /Applications/Xcode_26.0.app（指向 26.0.1 的软链），没有 Xcode_26.app。
      # 选不到必须让构建失败——不能静默回落到默认的 16.4（iOS 18 SDK），
      # LiquidGlassKit 的原生玻璃路径（glassEffect / GlassEffectContainer）
      # 编译期就要 iOS 26 SDK。
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app
          xcodebuild -version
          xcodebuild -version | grep -q "^Xcode 26" || {
            echo "::error::Xcode 26 未选中，LiquidGlassKit 无法编译"; exit 1; }

      - name: Resolve Swift packages (Charts, LiquidGlassKit)
        run: |
          xcodebuild -project ios/DevicePerfMonitor.xcodeproj \
            -scheme DevicePerfMonitor \
            -resolvePackageDependencies

      # 未签名构建：CI 里没有开发者证书，用 CODE_SIGNING_ALLOWED=NO 出归档。
      # 产物可以拿回本地用 codesign/xcodebuild -exportArchive 重签名后装机，
      # 或在仓库 Secrets 里配好证书后自行改成本地 export 流程。
      - name: Archive (unsigned)
        run: |
          xcodebuild -project ios/DevicePerfMonitor.xcodeproj \
            -scheme DevicePerfMonitor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/DevicePerfMonitor.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      # 打成 .ipa（Payload/ 布局 + zip）。未签名，装机前需重签名。
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/DevicePerfMonitor.xcarchive/Products/Applications/DevicePerfMonitor.app" \
            build/Payload/
          (cd build && zip -qry DevicePerfMonitor-unsigned.ipa Payload)
          ls -lh build/DevicePerfMonitor-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DevicePerfMonitor-iOS-${{ github.sha }}
          path: |
            build/DevicePerfMonitor-unsigned.ipa
            build/DevicePerfMonitor.xcarchive
          if-no-files-found: error
