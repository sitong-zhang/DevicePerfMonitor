name: Sign & Publish Install Link

# 全能签「免电脑安装」分发通道（把 CI 当作签名服务）。
#
# 原理：iPhone 无法直接安装未签名 IPA。先用开发者证书把全能签签好，
# 再通过一个 itms-services 安装清单托管安装——手机 Safari 点一下即装，
# 全程无需连接电脑。
#
# 需要三项仓库 Secrets（付费 Apple 开发者账号，99 美元/年）：
#   SIGN_CERT_P12        签名证书 (.p12) 的 base64
#   SIGN_CERT_PASSWORD   .p12 的导出密码
#   SIGN_PROVISION       描述文件 (.mobileprovision) 的 base64
#   注意：描述文件必须包含目标设备的 UDID（Ad Hoc 或开发证书），否则装不上。
#
# 未配置上述 Secrets 时，本工作流只打印缺失提示并成功退出，不做任何发布。
on:
  workflow_dispatch:

jobs:
  sign-and-publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验签名凭证是否齐备
        id: guard
        env:
          P12: ${{ secrets.SIGN_CERT_P12 }}
          PASS: ${{ secrets.SIGN_CERT_PASSWORD }}
          PROV: ${{ secrets.SIGN_PROVISION }}
        run: |
          if [ -z "$P12" ] || [ -z "$PASS" ] || [ -z "$PROV" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 SIGN_CERT_P12 / SIGN_CERT_PASSWORD / SIGN_PROVISION，" \
                 "跳过签名发布。请在仓库 Secrets 中添加这三项后重跑。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "签名凭证齐备，开始重签。"
          fi

      - name: 下载未签名全能签 IPA
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download ios-unsigned -R "$GITHUB_REPOSITORY" -D . -p 'Quannengqian-unsigned.ipa'
          ls -lh Quannengqian-unsigned.ipa

      - name: 用开发者证书重签并打包
        if: steps.guard.outputs.skip == 'false'
        env:
          P12: ${{ secrets.SIGN_CERT_P12 }}
          PASS: ${{ secrets.SIGN_CERT_PASSWORD }}
          PROV: ${{ secrets.SIGN_PROVISION }}
        run: |
          set -euo pipefail
          echo "$P12"  | base64 -d > cert.p12
          echo "$PROV" | base64 -d > profile.mobileprovision

          KC=build.keychain
          KCPW=githubactions
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import cert.p12 -k "$KC" -P "$PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC"

          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk -F'"' 'NR==1{print $2}')
          echo "签名身份：$IDENTITY"

          # 从描述文件提取 entitlements（保证与应用能力的授权一致）
          security cms -D -i profile.mobileprovision > profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' profile.plist > entitlements.plist

          rm -rf Payload
          unzip -q Quannengqian-unsigned.ipa -d .
          APP=$(find Payload -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then echo "未找到 .app"; exit 1; fi
          echo "目标应用：$APP"

          cp profile.mobileprovision "$APP/embedded.mobileprovision"
          codesign -f --deep -s "$IDENTITY" --keychain "$KC" --entitlements entitlements.plist "$APP"
          codesign -v "$APP"

          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" 2>/dev/null || echo "1.0")
          echo "bundle=$BID version=$VER"
          echo "APP_BUNDLE_ID=$BID" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"

          rm -f Quannengqian-signed.ipa
          zip -qry Quannengqian-signed.ipa Payload
          ls -lh Quannengqian-signed.ipa

      - name: 发布签名版到 ios-signed Release
        if: steps.guard.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-signed
          name: 全能签 · 签名版（免电脑一键安装）
          body: |
            已用开发者证书签名，iPhone 访问安装页即可一键安装，无需电脑。
            本产物由 Sign & Publish Install Link 工作流自动生成。
          files: Quannengqian-signed.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 检出 gh-pages 分支
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: 生成 itms-services 安装清单并发布到 Pages
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          IPA_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/ios-signed/Quannengqian-signed.ipa"
          cat > manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>$IPA_URL</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>${APP_BUNDLE_ID}</string>
                  <key>bundle-version</key><string>${APP_VERSION}</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>全能签</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          # 同步安装页与安装清单到 Pages
          cp manifest.plist pages/manifest.plist
          cp website/install.html pages/install.html
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.plist install.html
          git commit -m "chore(pages): 更新全能签安装清单（run $GITHUB_RUN_NUMBER）" || echo "无变更"
          git push origin HEAD:gh-pages
          echo "安装清单已发布：$IPA_URL"
