name: Free Cert Sign & Publish

# 自动扫描公开免费企业证书源（signhub.pro 等），挑一张「未被吊销且描述文件未过期」的，
# 自动补全苹果 WWDR 中间证书链后重签全能签并发布：
#   1. 签好的 IPA  -> ios-signed Release
#   2. itms-services 安装清单 -> gh-pages（官网「一键安装」按钮即用它）
#
# 经验教训（2026-10-29 实测）：
#   * p12 里只有叶子证书（缺 WWDR 中间证书）-> iOS 报「无法验证其完整性」
#   * 共享企业证书会被苹果批量吊销 -> 签名前必须 OCSP 查吊销，否则白跑一轮
#   * China Telecom 包（2026.06.16）已于 2026-10 被吊销；Aramco/越南航空描述文件已过期

on:
  workflow_dispatch:
  schedule:
    - cron: "20 21 * * 5" # 每周五自动重签防过期
    - cron: "40 1 * * *"  # 每日 09:40(北京) 扫描新流出的免费证书（证书雷达）

# 发布 Release 与推送 gh-pages 需要写权限
permissions:
  contents: write

env:
  CERT_URL: "https://signhub.pro/Public/freecerts/%5B2026.06.16%5DTelecomCorporationLimited.zip"
  CERT_PASS: "gbox"

jobs:
  free-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译 zsign（Linux iOS 签名工具）
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ pkg-config libssl-dev
          git clone --depth 1 https://github.com/zhlynn/zsign.git /tmp/zsign
          cd /tmp/zsign/build/linux
          make
          cp /tmp/zsign/bin/zsign /usr/local/bin/

      - name: 扫描证书源，挑一张「未吊销 + 链完整」的可用证书
        id: pick
        run: |
          set -uo pipefail
          # 候选：已知源 + 官网页面上抓到的新包
          CANDIDATES=$( (echo "$CERT_URL"; curl -sL "https://signhub.pro/" -A "Mozilla/5.0" | \
            grep -oE 'https://[^"]*freecerts/[^"]+\.zip' | sed 's/&amp;/\&/g') | sort -u )
          echo "候选证书包: $CANDIDATES"
          FOUND=""
          for URL in $CANDIDATES; do
            echo "=== 检查 $URL ==="
            rm -rf certdir && mkdir certdir
            curl -sL "$URL" -o cert.zip || continue
            unzip -oq cert.zip -d certdir 2>/dev/null || continue
            P12=$(find certdir -name "*.p12" ! -path "*__MACOSX*" | head -1)
            PROV=$(find certdir -name "*.mobileprovision" ! -path "*__MACOSX*" | head -1)
            [ -n "$P12" ] && [ -n "$PROV" ] || continue
            # 描述文件：企业分发 + 未过期
            openssl smime -inform DER -verify -noverify -in "$PROV" -out prov.plist 2>/dev/null || continue
            OK=$(python3 - <<'PY'
          import plistlib, datetime
          d = plistlib.load(open("prov.plist","rb"))
          exp = d.get("ExpirationDate"); now = datetime.datetime.now(exp.tzinfo)
          print("yes" if (d.get("ProvisionsAllDevices") and exp > now) else "no")
          PY
            )
            [ "$OK" = "yes" ] || { echo "  描述文件过期或非企业分发，跳过"; continue; }
            # 拆叶子证书与私钥
            openssl pkcs12 -legacy -in "$P12" -passin "pass:$CERT_PASS" -clcerts -nokeys 2>/dev/null > leaf.pem || continue
            openssl pkcs12 -legacy -in "$P12" -passin "pass:$CERT_PASS" -nocerts -nodes 2>/dev/null > key.pem || continue
            # 下载对应代数的苹果 WWDR 中间证书（从签发者 OU=Gx 推断）
            GN=$(openssl x509 -in leaf.pem -noout -issuer | grep -oE "OU = G[0-9]+" | grep -oE "[0-9]+" | head -1)
            [ -n "$GN" ] || GN=3
            curl -sL "https://www.apple.com/certificateauthority/AppleWWDRCAG${GN}.cer" -o inter.cer
            openssl x509 -inform DER -in inter.cer -out inter.pem 2>/dev/null || openssl x509 -in inter.cer -out inter.pem
            openssl x509 -in inter.pem -noout -subject || continue
            # OCSP 查吊销（吊销=跳过）
            STATUS=$(openssl ocsp -issuer inter.pem -cert leaf.pem \
              -url "$(openssl x509 -in leaf.pem -noout -ocsp_uri)" 2>/dev/null | grep -oE "revoked|good" | head -1)
            echo "  OCSP 状态: ${STATUS:-unknown}"
            [ "$STATUS" = "good" ] || { echo "  已被吊销，跳过"; continue; }
            # 合并证书链导出新 p12（解决「无法验证其完整性」）
            cat leaf.pem inter.pem > chain.pem
            openssl pkcs12 -export -legacy -in chain.pem -inkey key.pem \
              -passout "pass:$CERT_PASS" -out chained.p12
            N=$(openssl pkcs12 -legacy -in chained.p12 -passin "pass:$CERT_PASS" -nokeys 2>/dev/null | grep -c "BEGIN CERTIFICATE")
            [ "$N" -ge 2 ] || { echo "  证书链合并失败（仅 $N 张），跳过"; continue; }
            echo "=== 命中可用证书：$URL（链上 $N 张证书）==="
            cp chained.p12 free.p12 && cp "$PROV" free.mobileprovision
            FOUND="$URL"
            break
          done
          if [ -n "$FOUND" ]; then
            echo "p12=free.p12" >> "$GITHUB_OUTPUT"
            echo "cert_url=$FOUND" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::当前所有公开免费证书源均不可用（已吊销/过期），等待新证书流出后重跑"
          fi

      - name: 下载未签名全能签 IPA
        if: steps.pick.outputs.p12 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download ios-unsigned -R "$GITHUB_REPOSITORY" -D . \
            -p 'Quannengqian-unsigned.ipa' --clobber
          ls -lh Quannengqian-unsigned.ipa

      - name: 用免费企业证书重签（含完整证书链）
        if: steps.pick.outputs.p12 != ''
        run: |
          set -euo pipefail
          zsign -k free.p12 -p "$CERT_PASS" -m free.mobileprovision \
            -o Quannengqian-signed.ipa -z 9 Quannengqian-unsigned.ipa
          ls -lh Quannengqian-signed.ipa
          python3 - <<'PY'
          import zipfile, plistlib, io
          z = zipfile.ZipFile("Quannengqian-signed.ipa")
          info = [n for n in z.namelist() if n.endswith(".app/Info.plist")][0]
          d = plistlib.load(io.BytesIO(z.read(info)))
          bid = d.get("CFBundleIdentifier"); ver = d.get("CFBundleShortVersionString", "1.0")
          open("app-meta.env","w").write(f"APP_BUNDLE_ID={bid}\nAPP_VERSION={ver}\n")
          print("bundle:", bid, "version:", ver)
          PY
          cat app-meta.env >> "$GITHUB_ENV"

      - name: 发布签名版到 ios-signed Release
        if: steps.pick.outputs.p12 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-signed
          name: 全能签 · 签名版（免费企业证书，一键安装）
          body: |
            已用公开免费企业证书签名（含完整 WWDR 证书链，签名前已 OCSP 验证未吊销）。
            iPhone 用 Safari 打开官网 install.html 点「一键安装」即可，无需电脑、无需 UDID。
            证书来源：${{ steps.pick.outputs.cert_url }}
            若安装报「无法验证其完整性」= 证书又被吊销，等证书雷达自动换新证书后重装。
          files: Quannengqian-signed.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新 gh-pages 安装清单
        if: steps.pick.outputs.p12 != ''
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" pages
          IPA_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/ios-signed/Quannengqian-signed.ipa"
          cat > pages/manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>$IPA_URL</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>${APP_BUNDLE_ID}</string>
                  <key>bundle-version</key><string>${APP_VERSION}</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>全能签</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST
          cp website/install.html pages/install.html
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.plist install.html
          git commit -m "chore(pages): 免费证书签名版安装清单（run $GITHUB_RUN_NUMBER）" || echo "无变更"
          git push origin HEAD:gh-pages
          echo "发布完成：$IPA_URL"
