name: Rescue Backend DB

# 一次性抢救工具：后端跑在没有持久磁盘的 runner 上，账号库此前靠 actions/cache
# 跨运行保存。把缓存里残留的 app.db 取出来，写进私有数据仓库
# （DevicePerfMonitor-data），之后由 backend.yml 正常接管。
#
# 用完即可删除本文件（数据已落到私有仓库后不再需要）。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: backend/data
          key: backend-db-${{ github.run_id }}
          restore-keys: |
            backend-db-

      - name: Inspect rescued database
        id: inspect
        run: |
          set -e
          DB=backend/data/app.db
          if [ ! -f "$DB" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "缓存里没有 app.db，无可抢救数据"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
import sqlite3, os
db = "backend/data/app.db"
size = os.path.getsize(db)
info = {"found": "true", "size": str(size), "users": "-1"}
try:
    c = sqlite3.connect(db); c.row_factory = sqlite3.Row
    rows = c.execute("SELECT id, account, email, nickname FROM users ORDER BY id").fetchall()
    c.close()
    info["users"] = str(len(rows))
    for r in rows:
        print(f"user::{dict(r)}")
except Exception as e:
    info["error"] = str(e)[:120]
for k, v in info.items():
    print(f"{k}={v}")
PY
          echo "----- 抢救到的数据库 -----"
          ls -la backend/data/

      - name: Push rescued database to private data repo
        if: steps.inspect.outputs.found == 'true'
        env:
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -e
          git config --global user.name "pulseguard-data-bot"
          git config --global user.email "pulseguard-data-bot@users.noreply.github.com"
          rm -rf /tmp/rescue-repo
          git clone --depth 1 \
            "https://x-access-token:${DATA_TOKEN}@github.com/sitong-zhang/DevicePerfMonitor-data.git" \
            /tmp/rescue-repo || {
              mkdir -p /tmp/rescue-repo
              cd /tmp/rescue-repo
              git init -q -b main
              git remote add origin "https://x-access-token:${DATA_TOKEN}@github.com/sitong-zhang/DevicePerfMonitor-data.git"
            }
          cd /tmp/rescue-repo
          # 私有仓库若已有更新的库（本次抢救前已产生数据），保留远端版本，避免倒退覆盖
          if [ -f app.db ]; then
            python3 - <<'PY'
import sqlite3
def n(p):
    try:
        c = sqlite3.connect(p); v = c.execute("SELECT COUNT(*) FROM users").fetchone()[0]; c.close(); return v
    except Exception:
        return -1
print("remote_users", n("app.db"), "rescued_users", n("../backend/data/app.db"))
PY
          fi
          cp "$GITHUB_WORKSPACE/backend/data/app.db" app.db
          git add app.db
          git commit -m "chore(data): 从 Actions 缓存抢救的后端数据库" || echo "无变化"
          git branch -M main
          git push origin main
          echo "抢救数据已写入私有数据仓库"
