name: GuanXu
options:
  bundleIdPrefix: com.guanxu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  GuanXu:
    type: application
    platform: iOS
    sources:
      - path: JianWei
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        INFOPLIST_FILE: JianWei/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.guanxu.GuanXu
        PRODUCT_NAME: GuanXu
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: "NO"
        ONLY_ACTIVE_ARCH: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
